services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_railway_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-smart_railway}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ./db/03_functions.sql:/docker-entrypoint-initdb.d/03_functions.sql:ro
      - ./db/04_triggers.sql:/docker-entrypoint-initdb.d/04_triggers.sql:ro
      - ./db/05_views.sql:/docker-entrypoint-initdb.d/05_views.sql:ro
      - ./db/06_seed.sql:/docker-entrypoint-initdb.d/06_seed.sql:ro
      - ./db/07_generate_inventory.sql:/docker-entrypoint-initdb.d/07_generate_inventory.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-smart_railway}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smart_railway_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@railway.com
      PGADMIN_DEFAULT_PASSWORD: AdminPassword123!
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
